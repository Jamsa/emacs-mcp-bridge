description = "Translate the active Emacs selection into fluent, natural English"

prompt = """
Translate or rewrite the currently selected region in Emacs into fluent, natural English.

Steps:
1. Call `mcp__emacs__get-active-buffer-context` to retrieve the active selection.
2. If `selection` is null or empty, stop and tell the user to select a region first.
3. Rewrite the selected text in idiomatic English. Preserve meaning and tone, keep markup intact (Markdown, code blocks, inline code, URLs), and keep identifier/code tokens in their original form.
4. Call `mcp__emacs__interactive-merge-selection` with the English text as the `text` argument.
5. Tell the user: "Ediff is open. Press `b` to apply the change in-place, `q` to quit."
"""
