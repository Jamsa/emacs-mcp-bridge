description = "Rewrite the active Emacs selection according to a custom prompt"

prompt = """
Rewrite the currently selected region in Emacs according to the user's instructions.

Steps:
1. Call `mcp__emacs__get-active-buffer-context` to retrieve the focused buffer and active selection.
2. If `selection` is null or empty, stop and tell the user to select a region first.
3. Rewrite the selected text according to the user's instruction. Preserve the original meaning as much as possible, keep markup intact (Markdown, code blocks, inline code, URLs).
4. Call `mcp__emacs__interactive-merge-selection` with the rewritten text as the `text` argument.
5. Tell the user: "Ediff is open. Press `b` to apply the change in-place, `q` to quit."
"""